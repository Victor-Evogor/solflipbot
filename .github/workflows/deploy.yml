name: Deploy Bot to Linode

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r *.py utils tests requirements.txt deployment/
          cd deployment && tar -czf ../bot-deployment.tar.gz .
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'
      
      - name: Add Linode to known hosts
        run: ssh-keyscan -H ${{ secrets.LINODE_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to Linode
        run: |
          scp bot-deployment.tar.gz ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }}:~/
          ssh ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }} << 'EOF'
            # Create app directory if it doesn't exist
            mkdir -p ~/solana-trader-bot
            
            # Clean existing files and extract new deployment
            rm -rf ~/solana-trader-bot/*
            tar -xzf ~/bot-deployment.tar.gz -C ~/solana-trader-bot
            rm ~/bot-deployment.tar.gz
            
            # Install dependencies on server
            cd ~/solana-trader-bot
            pip3 install --user -r requirements.txt
            
            # Create .env file if it doesn't exist
            if [ ! -f ~/solana-trader-bot/.env ]; then
              cat > ~/solana-trader-bot/.env << 'EOL'
              TELEGRAM_API_KEY=${{ secrets.TELEGRAM_API_KEY }}
              MONGODB_URI=${{ secrets.MONGODB_URI }}
              EOL
            else
              # Update existing .env file with new values
              sed -i 's/^TELEGRAM_API_KEY=.*/TELEGRAM_API_KEY=${{ secrets.TELEGRAM_API_KEY }}/g' ~/solana-trader-bot/.env
              sed -i 's/^MONGODB_URI=.*/MONGODB_URI=${{ secrets.MONGODB_URI }}/g' ~/solana-trader-bot/.env
            fi
            
            # Create systemd service file
            cat > ~/solana-trader-bot.service << 'EOL'
            [Unit]
            Description=Solana Trader Telegram Bot
            After=network.target
            
            [Service]
            Type=simple
            User=${{ secrets.LINODE_USER }}
            WorkingDirectory=/home/${{ secrets.LINODE_USER }}/solana-trader-bot
            ExecStart=/home/${{ secrets.LINODE_USER }}/.local/bin/python /home/${{ secrets.LINODE_USER }}/solana-trader-bot/bot.py
            Restart=on-failure
            RestartSec=10
            StandardOutput=journal
            StandardError=journal
            Environment="PYTHONUNBUFFERED=1"
            
            [Install]
            WantedBy=multi-user.target
            EOL
            
            # Move service file to systemd directory and set proper permissions
            sudo mv ~/solana-trader-bot.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable solana-trader-bot
            sudo systemctl restart solana-trader-bot
            
            # Check service status
            sudo systemctl status solana-trader-bot
            
          EOF